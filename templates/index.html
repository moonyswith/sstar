<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StarTracks</title>
    <!-- Путь изменен для работы в одной папке -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="phone-wrapper">
    <!-- Шапка приложения -->
    <div class="header">
        <div class="logo">Star<span>Tracks</span></div>
    </div>

    <!-- Зона поиска из вашего макета -->
    <div class="search-section">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Поиск музыки...">
            <button id="searchButton">Найти</button>
        </div>
        <div class="track-list" id="trackList"></div>
    </div>

    <!-- Главный экран плеера (Ваш макет) -->
    <div class="main-player">
        <div class="vinyl-container">
            <!-- Встроенный красивый темно-серый диск по умолчанию -->
            <div class="vinyl-disk" id="playerImgContainer">
                <svg id="defaultVinyl" viewBox="0 0 100 100" style="width:100%; height:100%;">
                    <circle cx="50" cy="50" r="48" fill="#1e1e1e" stroke="#2a2a2a" stroke-width="1"/>
                    <circle cx="50" cy="50" r="35" fill="none" stroke="#282828" stroke-width="0.5"/>
                    <circle cx="50" cy="50" r="25" fill="none" stroke="#282828" stroke-width="0.5"/>
                    <circle cx="50" cy="50" r="15" fill="#2a2a2a"/>
                    <circle cx="50" cy="50" r="4" fill="#141414"/>
                </svg>
                <img id="playerImg" src="" alt="Обложка" style="display: none;">
            </div>
            <button class="center-play-btn" id="centerPlayBtn">
                <div class="play-icon" id="playIcon"></div>
            </button>
        </div>

        <!-- Информация о треке (плашки из дизайна) -->
        <div class="track-meta">
            <h2 id="playerTitle">Выберите трек</h2>
            <p id="playerArtist">Введите название выше</p>
        </div>

        <audio id="audioPlayer"></audio>

        <!-- Нижняя панель управления как на вашем макете -->
        <div class="bottom-controls">
            <button class="nav-btn" id="prevBtn">⏮</button>
            <button class="nav-btn" id="nextBtn">⏭</button>
            <button class="nav-btn active" id="loopBtn">🔁</button>
        </div>
    </div>
</div>

<!-- Путь изменен для работы в одной папке -->
<script src="script.js"></script>
</body>
</html>
